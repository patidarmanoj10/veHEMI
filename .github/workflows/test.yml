name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

env:
    FOUNDRY_PROFILE: ci

jobs:
    check:
        strategy:
            fail-fast: true

        name: Foundry project
        runs-on: ubuntu-latest
        env:
            HEMI_RPC_URL: ${{ secrets.HEMI_RPC_URL }}
            # Optional reproducible fork block. Leave unset in CI to let the
            # fork tests that don't require determinism use `latest`; set to a
            # specific Hemi block in a variable or dispatch input when you
            # want bit-reproducible state-preservation runs.
            HEMI_FORK_BLOCK: ${{ vars.HEMI_FORK_BLOCK }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  submodules: recursive

            - name: Use nvmrc
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: ".nvmrc"

            - name: Run npm install
              run: npm i

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@8b0419c685ef46cb79ec93fbdc131174afceb730 # v1.6.0

            - name: Show Forge version
              run: |
                  forge --version

            - name: Run Forge build
              run: |
                  forge build --sizes
              id: build

            - name: Check storage layouts against golden fixtures
              run: |
                  chmod +x scripts/check-storage-layouts.sh
                  scripts/check-storage-layouts.sh
              id: storage-layout-gate

            - name: Run Forge tests
              run: |
                  forge test -vvv
              id: test

            - name: Run Hemi-fork tests (optional — requires HEMI_RPC_URL secret)
              if: env.HEMI_RPC_URL != ''
              timeout-minutes: 10
              # --threads 1 serializes test execution to keep the per-minute
              # RPC burst under Hemi's public-RPC 300-req/min cap (parallel
              # workers across 90+ fork tests otherwise trip HTTP 429).
              # --fork-block-number pins the fork to a reproducible block
              # when HEMI_FORK_BLOCK is set as a repo variable; unset leaves
              # the fork at latest. Block pinning enables Foundry's on-disk
              # RPC cache to absorb repeated reads across reruns.
              run: |
                  EXTRA_ARGS=""
                  if [ -n "$HEMI_FORK_BLOCK" ]; then
                      EXTRA_ARGS="--fork-block-number $HEMI_FORK_BLOCK"
                  fi
                  forge test \
                    --match-contract "ForkUpgradeVoteDelegation|ForkUpgradeNonTransferableCurve" \
                    --fork-url hemi \
                    --threads 1 \
                    $EXTRA_ARGS \
                    -vvv
              id: fork-test

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200  # MUST match Hardhat/production setting (R16-6-5, R18-7-NA3, R25-5-C1)
via_ir = true
evm_version = "cancun"  # Required for EIP-1153 transient storage (ReentrancyGuardTransient)
block_timestamp = 1_738_368_000 # Feb 1, 2025 at 00:00 GMT

# Allow reading the committed storage-layout goldens in test/fixtures/.
# Needed by test/StorageLayoutGolden.t.sol to validate the fixtures directly
# inside `forge test` (the CI shell gate is independent).
fs_permissions = [{ access = "read", path = "test/fixtures/" }]

# RPC aliases for fork tests.
#
# Use `--fork-url hemi` (the alias) rather than the raw URL so Foundry's
# rate-limit-aware retry kicks in when public Hemi RPC returns HTTP 429.
# `retries` = attempts per request (in addition to the first try); `retry_backoff`
# is the initial delay in ms, doubled per retry. Values sized to absorb a short
# burst of throttling without masking a sustained outage.
#
# Block pinning is opt-in via the HEMI_FORK_BLOCK env var: fork tests that want
# a reproducible snapshot read `vm.envOr("HEMI_FORK_BLOCK", uint256(0))` and
# call `vm.createSelectFork("hemi", pinnedBlock)` from setUp when non-zero.
[rpc_endpoints]
# retries + retry_backoff sized so the cumulative retry window
# (1s + 2s + 4s + 8s + 16s + 32s = 63s) exceeds Hemi's 60s rate-limit
# reset window, guaranteeing that a throttled request sees a cleared
# budget on the final retry.
hemi = { endpoint = "${HEMI_RPC_URL}", retries = 6, retry_backoff = 1000 }

# Dependencies with specific versions for reproducible builds
# NOTE: Actual OZ contracts resolve via node_modules (see remappings.txt).
# These versions must match package.json to avoid confusion.
[dependencies]
openzeppelin-contracts = "5.3.0"
openzeppelin-contracts-upgradeable = "5.3.0"

# Linting and formatting
[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1024
depth = 128
fail_on_revert = true

# Add custom scripts
[profile.default.scripts]
format = "prettier --write 'src/**/*.sol'"
lint = "solhint 'src/**/*.sol'"
check = "forge build && npm run lint"
